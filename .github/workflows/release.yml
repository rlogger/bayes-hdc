# SPDX-License-Identifier: MIT
#
# Automated GitHub Release on tag push. Builds the sdist + wheel,
# attaches them to the release, and drafts release notes from CHANGELOG.md.
# PyPI publishing is handled separately by publish.yml (idempotent).

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Validate tag and package versions
        run: |
          python - <<'PYCODE'
          import ast, os, pathlib, tomllib
          metadata = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          version = metadata["project"]["version"]
          module = ast.parse(pathlib.Path("bayes_hdc/__init__.py").read_text())
          exported = next(ast.literal_eval(node.value) for node in module.body
                          if isinstance(node, ast.Assign)
                          and any(isinstance(t, ast.Name) and t.id == "__version__"
                                  for t in node.targets))
          assert exported == version, (exported, version)
          assert os.environ["GITHUB_REF_NAME"] == "v" + version
          PYCODE

      - name: Build sdist + wheel
        run: python -m build
      - name: Test release artifact before creating a public release
        run: |
          python -m pip install twine
          python -m twine check dist/*
          python - <<'PYCODE'
          from pathlib import Path
          import subprocess, sys
          wheel = next(Path("dist").glob("*.whl"))
          subprocess.check_call([sys.executable, "-m", "pip", "install",
                                 f"{wheel}[dev,datasets,examples]"])
          PYCODE
          cd "$RUNNER_TEMP"
          python -m pytest "$GITHUB_WORKSPACE/tests" --import-mode=importlib -m "not network and not benchmark"
      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    permissions:
      contents: write
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          # Find the section for this tag version in CHANGELOG.md.
          # Fallback to a generic line if the section isn't found.
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          awk -v ver="$VERSION" '
            BEGIN { found = 0 }
            /^## / {
              if (found) exit
              if (index($0, "[" ver "]") > 0) found = 1
              next
            }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "bayes-hdc ${TAG}" > release_notes.md
          fi
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
